# /etc/nginx/sites-available/pulso  (en nodo0)
# Sustituye TU_SUBDOMINIO e IP_VPN_DE_LA_VM (salida de `tailscale ip -4` en la VM) antes de copiarlo.
# Reemplaza al sitio anterior que mandaba todo a danielserv (100.64.0.3:11434) sin autenticación.

# Límite de peticiones para las rutas caras (IA y apoyo). Este archivo se incluye dentro de `http {}`.
limit_req_zone $binary_remote_addr zone=pulso_ia:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pulso_api:10m rate=60r/m;

upstream pulso_app {
    server IP_VPN_DE_LA_VM:8000;     # FastAPI en la VM cliente, por la VPN de Headscale
}

server {
    listen 80;
    listen [::]:80;
    server_name TU_SUBDOMINIO.duckdns.org;

    # Certbot valida por el 80; todo lo demás va a HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name TU_SUBDOMINIO.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/TU_SUBDOMINIO.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_SUBDOMINIO.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 16k;          # las peticiones de la app son pequeñas
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;           # Ollama puede tardar; igual que OLLAMA_TIMEOUT

    location = /api/explicar {
        limit_req zone=pulso_ia burst=3 nodelay;
        proxy_pass http://pulso_app;
    }

    location = /api/apoyo {
        access_log off;                # no registrar ni siquiera la visita al módulo de apoyo
        limit_req zone=pulso_ia burst=5 nodelay;
        proxy_pass http://pulso_app;
    }

    location /api/ {
        limit_req zone=pulso_api burst=20 nodelay;
        proxy_pass http://pulso_app;
    }

    location / {
        proxy_pass http://pulso_app;
    }
}
